name: Mise à jour mensuelle des données GTFS

on:
  schedule:
    - cron: '30 6 1 * *'
  
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Installer et configurer la CLI Koyeb
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: "${{ secrets.KOYEB_API_TOKEN }}"

      - name: Déclencher le redéploiement sur Koyeb
        run: koyeb services redeploy "${{ vars.KOYEB_SERVICE || 'liniabus/liniabus' }}"
